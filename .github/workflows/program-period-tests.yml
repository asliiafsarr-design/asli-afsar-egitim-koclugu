name: Program period regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/student-specific-7-day-programs]

jobs:
  program-period-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run program period regression tests
        run: node --test tests/program-periods.test.js
      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline script blocks found');
          let checked = 0;
          for (const [index, match] of scripts.entries()) {
            const code = match[1].trim();
            if (!code) continue;
            new vm.Script(code, { filename: `index.html:inline-script-${index + 1}` });
            checked++;
          }
          console.log(`Syntax check passed for ${checked} inline script block(s).`);
          NODE
